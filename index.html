<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noodle — Sign in</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="auth-logo-icon">N</div>
        <div class="auth-logo-text">
          <strong>Noodle</strong>
          <span>Your learning, organised</span>
        </div>
      </div>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to access your courses and learning materials.</p>

      <div id="alert-area"></div>

      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" autocomplete="email">
        <span class="form-error" id="email-error">Please enter your email address.</span>
      </div>

      <div class="form-group">
        <div class="flex-between mb-8" style="margin-bottom:6px;">
          <label class="form-label" for="password" style="margin-bottom:0">Password</label>
          <a href="pages/forgot-password.html" class="text-sm text-primary-color" style="font-weight:500;">Forgot
            password?</a>
        </div>
        <input class="form-input" type="password" id="password" placeholder="Enter your password"
          autocomplete="current-password">
        <span class="form-error" id="password-error">Please enter your password.</span>
      </div>

      <button class="btn btn-primary btn-full btn-lg" onclick="handleSignIn()" style="margin-top:4px;">
        Sign in
      </button>

      <div class="auth-divider" style="margin:24px 0 20px;"><span>Don't have an account?</span></div>

      <a href="pages/register.html" class="btn btn-outline btn-full">
        Create an account
      </a>

      <div
        style="margin-top:28px; padding:16px; background:var(--gray-50); border-radius:var(--radius-md); border:1px solid var(--border);">
        <p class="text-sm text-muted font-medium" style="margin-bottom:10px;">Demo accounts</p>
        <div style="display:grid; gap:6px;">
          <button class="demo-btn" onclick="fillDemo('student@noodle.ac.nz','student123')">
            <span class="badge badge-teal" style="font-size:10px;">Student</span>
            <span class="text-sm">student@noodle.ac.nz</span>
          </button>
          <button class="demo-btn" onclick="fillDemo('lecturer@noodle.ac.nz','lecturer123')">
            <span class="badge badge-blue" style="font-size:10px;">Lecturer</span>
            <span class="text-sm">lecturer@noodle.ac.nz</span>
          </button>
          <button class="demo-btn" onclick="fillDemo('admin@noodle.ac.nz','admin123')">
            <span class="badge badge-amber" style="font-size:10px;">Admin</span>
            <span class="text-sm">admin@noodle.ac.nz</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <style>
    .demo-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, background 0.15s;
      color: var(--text);
    }

    .demo-btn:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }
  </style>

  <script src="js/app.js"></script>
  <script>
    // If already signed in, redirect
    const session = getSession();
    if (session) redirectByRole(session.role);

    function handleSignIn() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      let valid = true;

      document.getElementById('email-error').classList.remove('show');
      document.getElementById('password-error').classList.remove('show');
      document.getElementById('alert-area').innerHTML = '';

      if (!email) {
        document.getElementById('email-error').classList.add('show');
        document.getElementById('email').classList.add('error');
        valid = false;
      }
      if (!password) {
        document.getElementById('password-error').classList.add('show');
        document.getElementById('password').classList.add('error');
        valid = false;
      }
      if (!valid) return;

      const users = getUsers();
      const user = users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);

      if (!user) {
        document.getElementById('alert-area').innerHTML = `
        <div class="alert alert-error">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Incorrect email or password. Please try again.
        </div>`;
        return;
      }

      setSession(user);
      redirectByRole(user.role);
    }

    function fillDemo(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      document.getElementById('email').classList.remove('error');
      document.getElementById('password').classList.remove('error');
      document.getElementById('email-error').classList.remove('show');
      document.getElementById('password-error').classList.remove('show');
      document.getElementById('alert-area').innerHTML = '';
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleSignIn();
    });
  </script>
</body>

</html>
